<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0a0a1a;
      background-image: url("{{ url_for('static', filename='ss.jpg') }}");
      background-size: cover;
      background-position: center;
      color: white;
    }

    .navbar {
      background-color: #6c6c6c;
      padding: 10px 30px;
      display: flex;
      justify-content: start;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      margin-right: 30px;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
    }

    .button {
      margin: 15px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #d1d5db;
      color: #003366;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 250px;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #b0b7c2;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/">Home</a>
    <a href="/admin">Admin Login</a>
  </div>

  <div class="container">
    <h1>Welcome to the Admin Panel</h1>
    <form action="/register" method="get">
      <button class="button">Register New Student</button>
    </form>
    <form action="/take_attendance" method="get">
      <button class="button">Take Attendance</button>
    </form>
    <form action="/view_attendance" method="get">
      <button class="button">View Attendance</button>
    </form>
  </div>
</body>
</html>
