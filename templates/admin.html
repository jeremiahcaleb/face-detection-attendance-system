<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #003366;
      text-align: center;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
    }

    .login-box {
      background-color: white;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      border-radius: 10px;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background-color: #003366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-button:hover {
      background-color: #002244;
    }
  </style>
</head>
<body>

  <h2>Admin Login</h2>
  
  <div class="login-container">
    <div class="login-box">
      <form action="/admin_login" method="POST">
        <input type="text" name="username" placeholder="Username" class="input-field" required><br>
        <input type="password" name="password" placeholder="Password" class="input-field" required><br>
        <button type="submit" class="login-button">Login</button>
      </form>
    </div>
  </div>

</body>
</html>
